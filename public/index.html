<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 경량 게시판 - Intranet Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- 헤더 Navigation -->
    <header class="app-header">
      <div class="brand-area">
        <div class="brand-icon">🏢</div>
        <div class="brand-text">
          <h1>사내 통합 웹 게시판</h1>
          <span class="sub-title">Intranet Isolated Hub System</span>
        </div>
      </div>

      <!-- 카테고리 탭 -->
      <nav class="category-nav">
        <button class="nav-tab active" data-category="all">📌 전체보기</button>
        <button class="nav-tab" data-category="free">💬 자유게시판</button>
        <button class="nav-tab" data-category="qna">❓ 질문게시판</button>
        <button class="nav-tab" data-category="share">📁 자료공유</button>
      </nav>

      <div class="header-actions">
        <button class="btn btn-primary" id="btn-open-create">✏️ 글쓰기</button>
      </div>
    </header>

    <!-- 메인 대시보드 -->
    <main class="main-content">
      <section class="toolbar-section">
        <div class="category-title-area">
          <h2 id="current-category-name">전체보기</h2>
          <span class="badge badge-count" id="total-count-badge">0건</span>
        </div>

        <!-- 검색 영역: 통합검색 드롭다운 + 키워드 입력 -->
        <div class="search-box">
          <select id="search-type" class="search-select">
            <option value="all" selected>🔍 통합검색</option>
            <option value="title">📄 글제목</option>
            <option value="author">👤 작성자</option>
            <option value="file">📁 첨부파일명</option>
            <option value="comment">💬 댓글내용</option>
          </select>
          <input type="text" id="search-input" placeholder="검색어를 입력하세요..." autocomplete="off">
          <button id="btn-search" class="btn btn-icon-only" title="검색">🔍</button>
        </div>
      </section>

      <!-- 목록 테이블 -->
      <section class="posts-section">
        <div class="table-container">
          <table class="board-table">
            <thead>
              <tr>
                <th style="width: 130px;">분류</th>
                <th>제목</th>
                <th style="width: 150px;">작성자</th>
                <th style="width: 130px;">작성일</th>
              </tr>
            </thead>
            <tbody id="posts-tbody">
              <tr><td colspan="4" class="loading-cell">게시글을 불러오는 중입니다...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="pagination-controls"></div>
      </section>
    </main>
  </div>

  <!-- 글쓰기 모달 (UI/UX 대폭 개선) -->
  <div class="modal-backdrop" id="modal-create-post">
    <div class="modal-card">
      <div class="modal-header">
        <h3>✏️ 새로운 게시글 등록</h3>
        <button class="modal-close" id="btn-close-create">&times;</button>
      </div>
      <form id="create-post-form" enctype="multipart/form-data">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="post-category">게시판 카테고리 <span class="req">*</span></label>
              <select id="post-category" name="category" required>
                <option value="free">💬 자유게시판</option>
                <option value="qna">❓ 질문게시판</option>
                <option value="share">📁 자료공유</option>
              </select>
            </div>
            <div class="form-group flex-1">
              <label for="post-author">작성자 성명 <span class="req">*</span></label>
              <input type="text" id="post-author" name="author" placeholder="예: 홍길동 대리" required>
            </div>
            <div class="form-group flex-1">
              <label for="post-pincode">삭제 암호 (PIN 4자리) <span class="req">*</span></label>
              <input type="password" id="post-pincode" name="pinCode" placeholder="숫자 4자리" required maxlength="10">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-2">
              <label for="post-title">게시글 제목 <span class="req">*</span></label>
              <input type="text" id="post-title" name="title" placeholder="제목을 입력하세요" required>
            </div>
            <div class="form-group flex-1">
              <label for="post-content-type">작성 모드 (형식)</label>
              <select id="post-content-type" name="contentType">
                <option value="text" selected>📄 일반 텍스트 (Plain)</option>
                <option value="markdown">📝 마크다운 (Markdown)</option>
              </select>
            </div>
          </div>

          <!-- GitHub 스타일 Write / Preview 탭 영역 -->
          <div class="form-group">
            <div class="editor-tab-bar">
              <div class="editor-tabs">
                <button type="button" class="editor-tab active" id="tab-editor-write">✏️ 작성 (Write)</button>
                <button type="button" class="editor-tab" id="tab-editor-preview">👁️ 미리보기 (Preview)</button>
              </div>
              <span class="editor-hint" id="editor-mode-hint">📄 일반 텍스트 작성 중</span>
            </div>

            <!-- Write textarea -->
            <div id="editor-write-box">
              <textarea id="post-content" name="content" rows="10" placeholder="자유롭게 본문 내용을 작성해 주세요..." required></textarea>
            </div>

            <!-- Preview box -->
            <div id="editor-preview-box" class="preview-content-box markdown-body" style="display: none;">
              <p style="color: var(--text-muted);">미리볼 내용을 작성해 주세요.</p>
            </div>
          </div>

          <div class="form-group">
            <label>첨부파일 (자유롭게 업로드 가능)</label>
            <div class="file-dropzone" id="file-dropzone">
              <div class="dropzone-prompt">
                <p>📤 파일을 여기에 드래그하거나 <strong>클릭하여 첨부</strong>하세요.</p>
              </div>
              <input type="file" id="file-input" name="attachments" multiple style="display: none;">
            </div>
            <div class="file-preview-list" id="file-preview-list"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-create">취소</button>
          <button type="submit" class="btn btn-primary">게시글 등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 상세보기 모달 -->
  <div class="modal-backdrop" id="modal-view-post">
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <div class="view-header-title">
          <span class="badge" id="view-category-badge">분류</span>
          <h3 id="view-title">제목</h3>
        </div>
        <button class="modal-close" id="btn-close-view">&times;</button>
      </div>
      <div class="modal-body">
        <div class="view-meta-bar">
          <div class="meta-item">👤 작성자: <strong id="view-author">--</strong></div>
          <div class="meta-item">🕒 작성일: <span id="view-date">--</span></div>
          <div class="meta-item">📝 형식: <span class="badge badge-count" id="view-content-type-badge">일반 텍스트</span></div>
        </div>

        <div class="view-content-box" id="view-content"></div>

        <div class="view-attachments-section" id="view-attachments-section" style="display: none;">
          <h4>📎 첨부파일 목록</h4>
          <div class="attachment-cards" id="view-attachment-cards"></div>
        </div>

        <div class="view-action-bar">
          <button class="btn btn-outline btn-danger" id="btn-delete-post">🗑️ 게시글 삭제</button>
        </div>

        <hr class="divider">

        <!-- 댓글 -->
        <div class="comments-section">
          <h4>💬 댓글 <span id="comment-count-badge">(0)</span></h4>
          <div class="comment-input-card">
            <div class="form-row">
              <input type="text" id="comment-author" placeholder="이름" style="max-width: 140px;">
              <input type="password" id="comment-pin" placeholder="암호" style="max-width: 100px;">
              <input type="text" id="comment-content" placeholder="댓글 내용을 입력하세요..." class="flex-2">
              <button class="btn btn-primary" id="btn-submit-comment">등록</button>
            </div>
          </div>
          <div class="comment-list" id="comment-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
